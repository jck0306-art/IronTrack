<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IronTrack | 철분제 복용 & 피검사 수치 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-16">

  <!-- 상단 헤더 -->
  <header class="sticky top-0 z-40 bg-slate-950/90 backdrop-blur-md border-b border-slate-800 px-6 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-rose-400">
        <i class="fa-solid fa-droplet text-base"></i>
      </div>
      <div>
        <span class="font-black text-base tracking-wider bg-gradient-to-r from-rose-400 to-amber-400 bg-clip-text text-transparent">
          IronTrack
        </span>
        <span class="text-[11px] text-slate-400 ml-1.5 hidden sm:inline">철분 복용 & 혈액검사 맞춤 스마트 트래커</span>
      </div>
    </div>
    <div id="sync-status" class="text-[10px] px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5">
      <i class="fa-solid fa-cloud"></i> 실시간 동기화
    </div>
  </header>

  <!-- 메인 좌우 2분할 레이아웃 -->
  <main class="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- [좌측 5칸] 철분제 복용 체크 & 달력 -->
    <section class="lg:col-span-5 space-y-5">
      
      <!-- 오늘의 복용 원클릭 카드 -->
      <div class="glass rounded-3xl p-5 shadow-xl border border-slate-800 space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-capsules text-rose-400"></i> 오늘의 철분제 복용
          </h2>
          <span id="today-date-str" class="text-xs text-slate-400 font-mono"></span>
        </div>

        <button id="today-toggle-btn" onclick="window.toggleTodayIntake()" class="w-full py-4 rounded-2xl font-bold text-sm transition flex items-center justify-center gap-2.5 shadow-lg">
        </button>

        <!-- 연속 복용 통계 뱃지 -->
        <div class="grid grid-cols-2 gap-3 pt-1">
          <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800/80 text-center">
            <span class="text-[10px] text-slate-400 block mb-0.5">연속 복용 스트릭</span>
            <span id="current-streak" class="text-lg font-black text-rose-400 font-mono">0일째 🔥</span>
          </div>
          <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800/80 text-center">
            <span class="text-[10px] text-slate-400 block mb-0.5">이번 달 복용률</span>
            <span id="month-rate" class="text-lg font-black text-amber-300 font-mono">0%</span>
          </div>
        </div>
      </div>

      <!-- 월별 복용 달력 뷰 -->
      <div class="glass rounded-3xl p-5 shadow-xl border border-slate-800 space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
            <i class="fa-regular fa-calendar-check text-indigo-400"></i> 복용 히스토리
          </h3>
          <div class="flex items-center gap-2 text-xs">
            <button onclick="window.changeCalendarMonth(-1)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300"><i class="fa-solid fa-chevron-left text-[10px]"></i></button>
            <span id="cal-month-title" class="font-bold font-mono text-white"></span>
            <button onclick="window.changeCalendarMonth(1)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300"><i class="fa-solid fa-chevron-right text-[10px]"></i></button>
          </div>
        </div>

        <div class="grid grid-cols-7 gap-1 text-center text-[11px] text-slate-500 font-semibold py-1">
          <span class="text-rose-400">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="text-indigo-400">토</span>
        </div>
        <div id="calendar-days-grid" class="grid grid-cols-7 gap-1"></div>
        <p class="text-[10px] text-slate-500 text-right pt-1">날짜를 클릭해 복용 여부를 토글할 수 있습니다.</p>
      </div>

    </section>

    <!-- [우측 7칸] 피검사 수치 그래프 & 기록 표 -->
    <section class="lg:col-span-7 space-y-5">

      <!-- 수치 추이 꺾은선 그래프 (동적 항목 탭 & 기준선) -->
      <div class="glass rounded-3xl p-5 md:p-6 shadow-xl border border-slate-800 space-y-4">
        <div class="flex flex-wrap justify-between items-center gap-2">
          <div>
            <h2 class="text-sm font-bold text-white flex items-center gap-2">
              <i class="fa-solid fa-chart-line text-amber-400"></i> 검사 수치 추이 & 적정선
            </h2>
            <p class="text-[11px] text-slate-400 mt-0.5">상단 탭을 눌러 각 검사 항목별 변화 곡선을 확인합니다.</p>
          </div>
          <!-- ⚙️ 검사 항목 설정 버튼 -->
          <button onclick="window.openMetricsManageModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-xl font-semibold flex items-center gap-1.5 transition">
            <i class="fa-solid fa-sliders text-amber-400"></i> 항목/기준치 관리
          </button>
        </div>

        <!-- 동적 지표 전환 탭 컨테이너 -->
        <div id="metrics-tab-container" class="flex flex-wrap gap-1.5 bg-slate-900/80 p-1.5 rounded-2xl border border-slate-800"></div>

        <!-- Chart.js 캔버스 -->
        <div class="relative w-full h-64 bg-slate-900/60 rounded-2xl p-2 border border-slate-800">
          <canvas id="labChart"></canvas>
        </div>
      </div>

      <!-- 피검사 기록 테이블 -->
      <div class="glass rounded-3xl p-5 shadow-xl border border-slate-800 space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="text-sm font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-vial text-indigo-400"></i> 피검사 기록 목록
          </h3>
          <button onclick="window.openLabModal()" class="text-xs bg-rose-600 hover:bg-rose-500 text-white font-bold px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-plus"></i> 새 검사결과 입력
          </button>
        </div>

        <div class="overflow-x-auto border border-slate-800 rounded-2xl bg-slate-900/40">
          <table class="w-full text-left text-xs">
            <thead id="lab-table-head" class="bg-slate-900 border-b border-slate-800 text-slate-400 text-[11px]"></thead>
            <tbody id="lab-table-body" class="divide-y divide-slate-800/60"></tbody>
          </table>
        </div>
      </div>

    </section>

  </main>

  <!-- 1. 피검사 결과 등록/수정 모달 (동적 항목 입력) -->
  <div id="lab-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 rounded-3xl max-w-md w-full p-6 border border-slate-700 space-y-4 shadow-2xl">
      <h3 id="lab-modal-title" class="text-base font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-vial text-rose-400"></i> 피검사 결과 등록
      </h3>
      <input type="hidden" id="edit-lab-idx" value="-1" />
      
      <div>
        <label class="text-xs text-slate-400 block mb-1">검사 일자 *</label>
        <input id="lab-date" type="date" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-rose-500" />
      </div>

      <!-- 동적으로 생성되는 각 검사 항목 입력 필드 -->
      <div id="dynamic-metric-inputs" class="grid grid-cols-2 gap-3"></div>

      <div>
        <label class="text-xs text-slate-400 block mb-1">병원명 / 처방 내용 메모</label>
        <input id="lab-memo" type="text" placeholder="예: OO내과 처방 (철분제 1정)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-rose-500" />
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="window.closeLabModal()" class="px-3.5 py-2 text-xs bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300">취소</button>
        <button onclick="window.saveLabRecord()" class="px-4 py-2 text-xs bg-rose-600 hover:bg-rose-500 rounded-xl text-white font-bold">저장하기</button>
      </div>
    </div>
  </div>

  <!-- 2. 검사 항목 & 기준치 추가/수정 모달 -->
  <div id="metrics-manage-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 rounded-3xl max-w-lg w-full p-6 border border-slate-700 space-y-4 shadow-2xl flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-sliders text-amber-400"></i> 검사 항목 & 목표 기준치 관리
        </h3>
        <button onclick="window.closeMetricsManageModal()" class="text-slate-500 hover:text-white p-1"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-2 flex-1 overflow-y-auto pr-1" id="metrics-manage-list"></div>

      <div class="pt-3 border-t border-slate-800 flex justify-between items-center">
        <button onclick="window.addNewMetricPrompt()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-2 rounded-xl transition flex items-center gap-1.5">
          <i class="fa-solid fa-plus"></i> 새 검사항목 추가
        </button>
        <button onclick="window.closeMetricsManageModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-4 py-2 rounded-xl">
          닫기
        </button>
      </div>
    </div>
  </div>

  <!-- 🌐 패밀리 사이트 퀵 네비게이터 플로팅 UI -->
  <div class="fixed bottom-6 right-6 z-50">
    <div id="family-site-menu" class="hidden mb-3 w-52 bg-slate-900/95 backdrop-blur-md border border-slate-700/80 rounded-2xl shadow-2xl p-2 space-y-1 transition-all">
      <div class="px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-400 border-b border-slate-800/80 mb-1">
        Family Sites
      </div>
      
      <a href="https://jck0306-art.github.io/portal/" class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800/80 transition group">
        <div class="w-6 h-6 rounded-lg bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-400 group-hover:bg-indigo-600 group-hover:text-white transition">
          <i class="fa-solid fa-house text-[10px]"></i>
        </div>
        <span>포털 허브</span>
      </a>

      <a href="https://jck0306-art.github.io/license-mgmt/" class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800/80 transition group">
        <div class="w-6 h-6 rounded-lg bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-400 group-hover:bg-indigo-600 group-hover:text-white transition">
          <i class="fa-solid fa-graduation-cap text-[10px]"></i>
        </div>
        <span>자격증 관리</span>
      </a>

      <a href="https://jck0306-art.github.io/IronTrack/" class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800/80 transition group">
        <div class="w-6 h-6 rounded-lg bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-400 group-hover:bg-rose-600 group-hover:text-white transition">
          <i class="fa-solid fa-droplet text-[10px]"></i>
        </div>
        <span>철분 관리 (IronTrack)</span>
      </a>

      <a href="https://jck0306-art.github.io/virtual/" class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800/80 transition group">
        <div class="w-6 h-6 rounded-lg bg-pink-500/10 border border-pink-500/30 flex items-center justify-center text-pink-400 group-hover:bg-pink-600 group-hover:text-white transition">
          <i class="fa-solid fa-compact-disc text-[10px]"></i>
        </div>
        <span>덕질 아카이브</span>
      </a>
    </div>

    <!-- 플로팅 토글 버튼 -->
    <button id="family-site-btn" onclick="toggleFamilySiteMenu()" class="w-12 h-12 rounded-2xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 border border-slate-700/80 shadow-2xl flex items-center justify-center text-lg transition duration-200 hover:scale-105 active:scale-95 ml-auto">
      <i id="family-site-icon" class="fa-solid fa-layer-group text-indigo-400"></i>
    </button>
  </div>

  <script type="module" src="js/app.js"></script>

  <script>
    function toggleFamilySiteMenu() {
      const menu = document.getElementById('family-site-menu');
      const icon = document.getElementById('family-site-icon');
      
      if (menu.classList.contains('hidden')) {
        menu.classList.remove('hidden');
        icon.className = "fa-solid fa-xmark text-slate-400 text-base";
      } else {
        menu.classList.add('hidden');
        icon.className = "fa-solid fa-layer-group text-indigo-400";
      }
    }

    document.addEventListener('click', function(e) {
      const container = document.getElementById('family-site-menu')?.parentElement;
      const menu = document.getElementById('family-site-menu');
      const icon = document.getElementById('family-site-icon');
      if (container && !container.contains(e.target) && menu && !menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
        if (icon) icon.className = "fa-solid fa-layer-group text-indigo-400";
      }
    });
  </script>
</body>
</html>
